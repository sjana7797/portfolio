<svg xmlns="http://www.w3.org/2000/svg" width="44" height="42" viewBox="0 0 44 42">
  <!-- Stylized lion-prow caravel. Hotspot sits on the figurehead's nose. -->
  <g fill="none" stroke="#0f2036" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- mast -->
    <path d="M27 27V6" stroke-width="1.8"/>
    <!-- pennant -->
    <path d="M27 5.5l8 2.6-8 2.6z" fill="#b81d22" stroke="#0f2036"/>
    <!-- mainsail, bellied out to port -->
    <path d="M26 9c-7 2.4-11 6-12.5 9.6C16 20.4 21 22 26 22z" fill="#fffdf5"/>
    <!-- jib -->
    <path d="M28 12c4 1.6 6.4 3.8 7.4 6-2.2.9-4.8 1.3-7.4 1.3z" fill="#f4efe0"/>
    <!-- hull -->
    <path d="M8 26h30l-4.5 8.5H12.5z" fill="#e8a33d"/>
    <!-- grass deck stripe -->
    <path d="M9.6 29.2h27" stroke="#2f7d5c" stroke-width="2.2"/>
    <!-- lion figurehead -->
    <circle cx="8.5" cy="21.5" r="4.4" fill="#f5c542"/>
    <path d="M8.5 17.1l-2 -2.6M4.6 19.2l-3 -1.4M4.2 23.6l-3 1.2M8.5 25.9l-1.6 2.8" stroke="#e08a1e" stroke-width="1.7"/>
    <!-- muzzle + eye -->
    <path d="M4.5 21.6h2.2" stroke-width="1.5"/>
    <circle cx="9.4" cy="20.4" r="0.9" fill="#0f2036" stroke="none"/>
  </g>
</svg>
